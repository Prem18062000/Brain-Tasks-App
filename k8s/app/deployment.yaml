apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-tasks-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brain-tasks
  template:
    metadata:
      labels:
        app: brain-tasks
    spec:
      containers:
      - name: brain-tasks
        image: "175948132922.dkr.ecr.us-east-1.amazonaws.com/brain-tasks-app:latest"
        ports:
        - containerPort: 80
